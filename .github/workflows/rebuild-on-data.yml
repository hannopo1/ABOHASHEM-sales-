# Rebuild everything when new source data lands, and open a pull request that
# says what the new data did to the numbers.
#
# Source files arrive as "Add files via upload" commits straight onto main, so
# this watches those paths on main and proposes the regenerated outputs back as
# a PR. Nothing is committed to main automatically: the figures reach a board
# report, so a person approves the change in them.
#
# Dependencies are installed from the pinned requirements on purpose. Running
# with a newer statsmodels than the pinned 0.14.6 shifts the VIF diagnostics and
# makes every rebuild look like a data change when nothing changed.
name: Rebuild analysis on new data

on:
  push:
    branches: [main]
    paths:
      - "**.pdf"
      - "**.md"
      - "**.xlsx"
      - "data/cost/**"
      - "analysis/**.py"
      - "executive_dashboard/src/**.py"
      - "mobile/src/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Captured from the committed outputs, before anything is regenerated.
      - name: Capture the current headline figures
        run: python3 analysis/tools/kpi_snapshot.py capture /tmp/kpi-before.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r analysis/requirements.txt
          pip install -r executive_dashboard/requirements.txt
          pip install flake8 pytest

      - name: Run the analysis pipeline
        run: |
          set -e
          for f in analysis/0*.py analysis/1*.py; do
            echo "::group::$f"
            python3 "$f"
            echo "::endgroup::"
          done

      # build.py runs its own validation and exits non-zero on a failed hard
      # check, so a bad rebuild stops here rather than reaching a PR.
      - name: Build the executive dashboard
        run: python3 executive_dashboard/build.py

      - name: Build the mobile app
        run: python3 mobile/build_standalone.py

      - name: Lint
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test
        run: pytest -q

      - name: Diff the headline figures
        run: |
          python3 analysis/tools/kpi_snapshot.py capture /tmp/kpi-after.json
          {
            echo "إعادة بناء آلية بعد وصول بيانات مصدرية جديدة."
            echo
            echo "المصدر: \`${{ github.event.head_commit.message || 'تشغيل يدوي' }}\`"
            echo
            python3 analysis/tools/kpi_snapshot.py diff /tmp/kpi-before.json /tmp/kpi-after.json
            echo
            echo "### ما جرى التحقق منه"
            echo "- خط أنابيب التحليل كاملًا (01 → 13)"
            echo "- \`build.py\` بفحوصه الصارمة — يُجهض عند أي فشل مطابقة"
            echo "- ربط التكلفة: مطابقة لقائمة الدخل وللفواتير، وبوابة انحراف الأسعار"
            echo "- \`pytest\` و \`flake8\`"
            echo
            echo "راجع الفروق أعلاه قبل الدمج."
          } > /tmp/pr-body.md
          cat /tmp/pr-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open a pull request with the rebuilt outputs
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/rebuild-${{ github.run_id }}
          base: main
          title: "إعادة بناء التحليل بعد بيانات جديدة"
          body-path: /tmp/pr-body.md
          commit-message: |
            Rebuild analysis outputs after new source data

            Regenerated by .github/workflows/rebuild-on-data.yml. The pull
            request body carries the before/after comparison of the headline
            figures.
          add-paths: |
            data/processed/**
            dashboards/data.js
            executive_dashboard/data.js
            executive_dashboard/index.html
            executive_dashboard/insights.json
            executive_dashboard/processed_data.csv
            executive_dashboard/rep_exceptions.json
            executive_dashboard/executive_summary.pdf
            executive_dashboard/dashboard_standalone.html
            reports/**
            mobile/dist/**
          delete-branch: true
